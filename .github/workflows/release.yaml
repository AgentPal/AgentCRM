name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            goarch: amd64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
            goarch: arm64
          - os: macos-latest
            platform: darwin
            arch: amd64
            goarch: amd64
          - os: macos-latest
            platform: darwin
            arch: arm64
            goarch: arm64
          - os: windows-latest
            platform: windows
            arch: amd64
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        run: |
          cd cmd/agentcrm
          GOOS=${{ matrix.platform }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-X 'github.com/AgentPal/AgentCRM/internal/cmd.appVersion=${{ github.ref_name }}'" \
            -o agentcrm${{ matrix.platform == 'windows' && '.exe' || '' }} .

      - name: Package
        run: |
          cd cmd/agentcrm
          tar czf agentcrm-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz \
            agentcrm${{ matrix.platform == 'windows' && '.exe' || '' }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: agentcrm-${{ matrix.platform }}-${{ matrix.arch }}
          path: cmd/agentcrm/agentcrm-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: agentcrm-*
          merge-multiple: true

      - name: Generate Checksums
        run: sha256sum agentcrm-*.tar.gz > checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agentcrm-*.tar.gz
            checksums.txt
          generate_release_notes: true
